services:
  - type: web
    name: hm-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      # Ключ записи НИКОГДА не хранится в репозитории: значение задаётся вручную
      # в дашборде Render (Environment). sync: false означает «Render спросит
      # значение при деплое и не будет тянуть его из этого файла».
      - key: API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AUTH_USERS_JSON
        sync: false
      # Пусто = принимать запросы с любого origin. Для production задайте
      # конкретный GitHub Pages origin, например https://ekzotik-inc.github.io.
      # Чтобы сузить — перечислить через запятую, например:
      # https://ekzotik-inc.github.io
      - key: ALLOWED_ORIGINS
        sync: false
