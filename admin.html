<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <title>Админ · Тепловая карта</title>
  <meta name="theme-color" content="#097382"/>
  <meta name="color-scheme" content="light"/>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23097382'/%3E%3Cpath d='M12 4.5 5.5 7v5c0 4 3 6.5 6.5 7.5 3.5-1 6.5-3.5 6.5-7.5V7z' fill='none' stroke='%23ffffff' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
  <link rel="stylesheet" href="style.css?v=20261106k"/>
  <link rel="stylesheet" href="admin.css?v=20261106k"/>
</head>
<body class="admin-page">

<noscript><div class="a-note">Для работы страницы нужен JavaScript.</div></noscript>

<!-- Вход: та же сессия, что у карты; если её нет — войти здесь -->
<div id="ad-login" class="a-login" hidden>
  <form class="a-login-card" id="ad-login-form" autocomplete="on">
    <span class="a-logo" aria-hidden="true"></span>
    <h1>Админ панель</h1>
    <p id="ad-login-sub">Войдите под учёткой владельца</p>
    <label class="a-field"><span>Логин</span><input type="text" class="mf-input" id="ad-user" autocomplete="username" required/></label>
    <label class="a-field"><span>Пароль</span><input type="password" class="mf-input" id="ad-pass" autocomplete="current-password" required/></label>
    <button type="submit" class="a-btn wide" id="ad-login-btn">Войти</button>
    <div class="a-err" id="ad-login-err" role="alert"></div>
    <a class="a-link" href="index.html">Вернуться к карте</a>
  </form>
</div>

<div id="ad-app" class="a-shell" hidden>
  <aside class="a-side" id="a-side">
    <div class="a-brand"><span class="a-logo" aria-hidden="true"></span><div><b>Админ панель</b><small>Тепловая карта</small></div></div>
    <nav class="a-nav" id="a-nav" aria-label="Разделы"></nav>
    <div class="a-side-foot">
      <a class="a-btn ghost wide" href="index.html" id="a-tomap"></a>
      <div class="a-me"><span class="a-av" id="a-me-av" aria-hidden="true"></span><div><b id="a-me-name"></b><small>Админ</small></div>
        <button type="button" class="a-icon-btn" id="ad-logout" title="Выйти" aria-label="Выйти"></button></div>
    </div>
  </aside>
  <main class="a-main" id="a-main" tabindex="-1"></main>
</div>

<!-- Выезжающая панель и окно подтверждения -->
<div class="a-scrim" id="a-scrim" hidden></div>
<section class="a-drawer" id="a-drawer" role="dialog" aria-modal="true" aria-labelledby="a-drawer-title" hidden>
  <header class="a-drawer-head">
    <div><h2 id="a-drawer-title"></h2><p id="a-drawer-sub"></p></div>
    <button type="button" class="a-icon-btn" id="a-drawer-close" aria-label="Закрыть"></button>
  </header>
  <div class="a-drawer-body" id="a-drawer-body"></div>
</section>
<div class="a-dialog-wrap" id="a-dialog" hidden>
  <div class="a-dialog" role="alertdialog" aria-modal="true" aria-labelledby="a-dlg-title" aria-describedby="a-dlg-text">
    <h2 id="a-dlg-title"></h2>
    <div id="a-dlg-text"></div>
    <div class="a-dialog-acts">
      <button type="button" class="a-btn ghost" id="a-dlg-cancel">Отмена</button>
      <button type="button" class="a-btn" id="a-dlg-ok">Да</button>
    </div>
  </div>
</div>
<input type="file" id="a-file" hidden/>

<div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

<script>
  window._HM_SERVER_URL = 'https://hm-server-xpg0.onrender.com';
</script>
<script src="common.js?v=20261106k"></script>
<script src="admin.js?v=20261106k"></script>
</body>
</html>
