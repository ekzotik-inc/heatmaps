name: keep-server-warm

# Render's free tier sleeps after ~15 min idle, costing 30–60 s on the next
# cold start. Pinging /health on a schedule keeps the instance awake so the
# map's base dataset loads quickly. GitHub may delay scheduled runs by a few
# minutes and disables the schedule after 60 days of repo inactivity.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 60 https://hm-server-xpg0.onrender.com/health \
            && echo "server is awake" \
            || echo "ping failed (server may be waking) — non-fatal"
