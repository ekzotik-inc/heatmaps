name: ci

# Проверки на каждый push/PR: синтаксис клиента и сервера + ESLint.
# Сборки нет — проект статический, поэтому этого достаточно, чтобы на Pages
# никогда не уехал файл с синтаксической ошибкой.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна история для diff base…head в проверке версии кэша

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check (client + server)
        run: |
          node --check app.js
          node --check server/server.js

      - name: ESLint
        run: |
          npm install --no-audit --no-fund
          npx eslint app.js

      # Тесты: настоящий server.js поднимается на временной папке данных
      # (server/test), app.js — в Chromium через Playwright (test/). Прогон на
      # PostgreSQL — локально: npm run test:pg (нужен HM_TEST_PG_URL, см. CONTEXT.md).
      - name: Tests (server + browser)
        run: |
          npm ci --prefix server --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          npm test

      - name: Cache version bumped with app.js/style.css
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          if echo "$CHANGED" | grep -qE '^(app\.js|style\.css)$'; then
            if ! echo "$CHANGED" | grep -q '^index\.html$'; then
              echo "::error::app.js/style.css изменены, но index.html (версия кэша ?v=) — нет. См. CLAUDE.md"
              exit 1
            fi
          fi
